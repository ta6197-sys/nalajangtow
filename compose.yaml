services:
  web-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ulsan_clx_web
      POSTGRES_USER: ulsan_clx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env before starting PostgreSQL}
      TZ: Asia/Seoul
    volumes:
      - web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulsan_clx -d ulsan_clx_web"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      web-postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: web-postgres
      POSTGRES_DB: ulsan_clx_web
      POSTGRES_USER: ulsan_clx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env before starting PostgreSQL}
      WEB_EXPERIMENT_KEY: web-daylight-v1
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./input:/app/input:ro
      - ./results/web:/app/results/daily

volumes:
  web_postgres_data:
